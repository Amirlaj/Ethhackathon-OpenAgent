spring.application.name=agentmesh-app
server.port=${APP_PORT:8080}

# Agent discovery
AGENT_PARENT_DOMAIN=${AGENT_PARENT_DOMAIN:agentmesh-dev.eth}
AGENT_DEV_MODE=${AGENT_DEV_MODE:true}

# Logging
logging.level.mesh=INFO
logging.level.org.web3j=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
